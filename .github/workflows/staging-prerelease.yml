# Push/PR merge a staging -> build qa -> pre-release con zip.
# VERSION en raiz es la version base (ej: 1.0.0). Staging SIEMPRE genera v<VERSION>-rc.N:
# N autoincrementa mientras VERSION no cambie; si cambias VERSION, N vuelve a 1.
name: Staging pre-release

on:
  push:
    branches: [staging]

jobs:
  build-and-prerelease:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute rc tag
        id: ver
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100" `
                      -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          $pattern = "^v" + [regex]::Escape($version) + "-rc\.(\d+)$"
          $max = 0
          foreach ($r in $releases) {
            if ($r.tag_name -match $pattern) { $n = [int]$matches[1]; if ($n -gt $max) { $max = $n } }
          }
          echo "tag=v$version-rc.$($max + 1)" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend deps
        run: npm ci
        working-directory: lefarma.frontend

      - name: Build (multiappcli build:qa)
        run: pwsh ./multiappcli.ps1 build:qa

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: publish/lefarma-qa.zip
