# Push/PR merge a staging -> build qa -> pre-release con zip.
# El nombre sale del archivo VERSION en la raiz (ej: 1.0.0-rc.1 -> tag v1.0.0-rc.1).
# Lo editas en tu PR antes de mergear. Si no lo bump-eas y el tag ya existe, el run falla a proposito.
name: Staging pre-release

on:
  push:
    branches: [staging]

jobs:
  build-and-prerelease:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: echo "version=$((Get-Content VERSION -Raw).Trim())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend deps
        run: npm ci
        working-directory: lefarma.frontend

      - name: Build (multiappcli build:qa)
        run: pwsh ./multiappcli.ps1 build:qa

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: publish/lefarma-qa.zip
