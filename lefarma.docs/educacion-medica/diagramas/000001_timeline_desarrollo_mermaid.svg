<text x="588.6750000000001" y="58" text-anchor="middle" dy="0.35em" font-size="13" font-weight="500" fill="var(--_text)">&quot;Fase 1 · Base de datos&lt;br/&gt;0002 schema · 0003 = tipo_gerencia + 11 tablas · 0004 índices&lt;br/&gt;cascada PERSISTED · MS_Description · sin EF migrations&quot;</text>
