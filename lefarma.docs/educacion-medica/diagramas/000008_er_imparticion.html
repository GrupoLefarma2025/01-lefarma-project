<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impartición de Talleres — Esquema ER (ADR-00008)</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75;
    --color-soft:#7a8399; --color-accent:#eb6c36;
    --font-sans:'Geist',sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem;}
  .wrap{max-width:960px;width:100%;}
  .eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem;}
  h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:.25rem;}
  .sub{font-family:var(--font-mono);font-size:.72rem;color:var(--color-soft);margin-bottom:1.5rem;}
  svg{display:block;width:100%;height:auto;}
  .colophon{margin-top:1.25rem;padding-top:.75rem;border-top:1px solid rgba(45,49,66,.12);font-family:var(--font-mono);font-size:.68rem;color:var(--color-soft);letter-spacing:.04em;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Educación Médica · ADR-00008 · Esquema</p>
  <h1>Impartición de talleres — esquema ER</h1>
  <p class="sub">talleres + material (FOR-007) + asistencias (FOR-008) + evidencias + historial de estados + solicitudes (sin taller_aprobaciones)</p>

  <svg viewBox="0 0 960 1010" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Esquema entidad-relación de las tablas de impartición de talleres">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
    </defs>

    <!-- Conectores TALLERES -> hijos (codos r=8) -->
    <path d="M 400 260 L 400 288 Q 400 296 392 296 L 186 296 Q 178 296 178 304 L 178 336" fill="none" stroke="#4f5d75" stroke-width="1"/>
    <path d="M 460 260 L 460 336" fill="none" stroke="#4f5d75" stroke-width="1"/>
    <path d="M 520 260 L 520 288 Q 520 296 528 296 L 774 296 Q 782 296 782 304 L 782 336" fill="none" stroke="#4f5d75" stroke-width="1"/>
    <path d="M 430 260 L 430 288 Q 430 296 422 296 L 341 296 Q 333 296 333 304 L 333 600" fill="none" stroke="#4f5d75" stroke-width="1"/>
    <path d="M 490 260 L 490 288 Q 490 296 498 296 L 619 296 Q 627 296 627 304 L 627 600" fill="none" stroke="#4f5d75" stroke-width="1"/>

    <!-- Pata de gallo (N) en cada hijo -->
    <path d="M 172 328 L 178 336 M 184 328 L 178 336 M 178 328 L 178 336" fill="none" stroke="#4f5d75" stroke-width="1"/>
    <path d="M 454 328 L 460 336 M 466 328 L 460 336 M 460 328 L 460 336" fill="none" stroke="#4f5d75" stroke-width="1"/>
    <path d="M 776 328 L 782 336 M 788 328 L 782 336 M 782 328 L 782 336" fill="none" stroke="#4f5d75" stroke-width="1"/>
    <path d="M 327 592 L 333 600 M 339 592 L 333 600 M 333 592 L 333 600" fill="none" stroke="#4f5d75" stroke-width="1"/>
    <path d="M 621 592 L 627 600 M 633 592 L 627 600 M 627 592 L 627 600" fill="none" stroke="#4f5d75" stroke-width="1"/>

    <!-- Cardinalidad 1 -->
    <text x="404" y="278" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">1</text>
    <text x="464" y="278" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">1</text>
    <text x="524" y="278" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">1</text>
    <text x="337" y="282" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">1</text>
    <text x="497" y="282" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">1</text>
    <text x="186" y="278" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">N</text>
    <text x="468" y="278" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">N</text>
    <text x="790" y="278" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">N</text>
    <text x="341" y="282" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">N</text>
    <text x="635" y="282" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">N</text>

    <!-- TALLERES -->
    <rect x="320" y="44" width="280" height="216" rx="6" fill="#f5f5f5"/>
    <rect x="320" y="44" width="280" height="216" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
    <text x="336" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono',monospace">talleres</text>
    <text x="336" y="82" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">PK id_taller · INT IDENTITY</text>
    <text x="336" y="98" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">FK id_seleccion_hospital · INT NULL (extraordinario)</text>
    <text x="336" y="114" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">id_hospital · region · entidad · ciudad</text>
    <text x="336" y="130" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">FK id_matriz_individual / id_matriz_general</text>
    <text x="336" y="146" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">estado · CHECK (Creada…Realizado/Cancelado)</text>
    <text x="336" y="162" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">fecha_taller · hora_taller · lugar · participantes</text>
    <text x="336" y="178" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">fecha_realizado · DATE NULL (cierre)</text>
    <text x="336" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">es_extraordinario · motivo_extraordinario</text>
    <text x="336" y="210" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">FK lógica id_ejecutivo / id_especialista</text>
    <text x="336" y="226" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">auditoría estándar (activo · fechas · usuarios)</text>
    <text x="336" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">aggregate root · hard delete solo con Matriz Creada</text>

    <!-- TALLER_MATERIALES -->
    <rect x="40" y="336" width="276" height="170" rx="6" fill="#f5f5f5"/>
    <rect x="40" y="336" width="276" height="170" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="56" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono',monospace">taller_materiales</text>
    <text x="56" y="374" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">PK id_taller_material</text>
    <text x="56" y="390" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">FK id_taller · UNIQUE (1:1)</text>
    <text x="56" y="406" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">fecha_entrega · cargo_puesto · producto · cantidad</text>
    <text x="56" y="422" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">checklist: lista · flayers · cómputo · proyector</text>
    <text x="56" y="438" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">dulces · modelo anatómico</text>
    <text x="56" y="454" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">nombre_ejecutivo_recepcion · observaciones</text>
    <text x="56" y="470" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">firma_url · fecha_recepcion · id_usuario_recepcion</text>
    <text x="56" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">confirmación EV (patrón bitácora)</text>

    <!-- TALLER_ASISTENCIAS -->
    <rect x="340" y="336" width="276" height="170" rx="6" fill="#f5f5f5"/>
    <rect x="340" y="336" width="276" height="170" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="356" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono',monospace">taller_asistencias</text>
    <text x="356" y="374" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">PK id_asistencia</text>
    <text x="356" y="390" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">FK id_taller · N (máx. 20)</text>
    <text x="356" y="406" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">numero · CHECK 1..20 · UNIQUE (id_taller, numero)</text>
    <text x="356" y="422" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">nombre_medico · cedula_profesional</text>
    <text x="356" y="438" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">puesto_medico · telefono_celular</text>
    <text x="356" y="454" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">correo_electronico</text>
    <text x="356" y="470" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">observaciones (médico líder +/−)</text>
    <text x="356" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">hard delete · transcripción FOR-008</text>

    <!-- TALLER_EVIDENCIAS -->
    <rect x="644" y="336" width="276" height="170" rx="6" fill="#f5f5f5"/>
    <rect x="644" y="336" width="276" height="170" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="660" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono',monospace">taller_evidencias</text>
    <text x="660" y="374" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">PK id_evidencia</text>
    <text x="660" y="390" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">FK id_taller · N</text>
    <text x="660" y="406" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">tipo_evidencia · CHECK (foto|video|documento)</text>
    <text x="660" y="422" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">archivo_url · NVARCHAR(500) NOT NULL</text>
    <text x="660" y="438" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">descripcion · fecha_evidencia</text>
    <text x="660" y="454" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">archivos servidos por /api/archivos</text>
    <text x="660" y="470" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">captura solo con el taller En curso</text>
    <text x="660" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">hard delete</text>

    <!-- TALLER_ESTADOS_HISTORIAL -->
    <rect x="195" y="600" width="276" height="170" rx="6" fill="#f5f5f5"/>
    <rect x="195" y="600" width="276" height="170" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="211" y="622" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono',monospace">taller_estados_historial</text>
    <text x="211" y="638" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">PK id_historial</text>
    <text x="211" y="654" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">FK id_taller · N</text>
    <text x="211" y="670" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">estado_anterior (NULL en extraordinario)</text>
    <text x="211" y="686" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">estado_nuevo · NOT NULL</text>
    <text x="211" y="702" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">origen · CHECK (Automatico|Manual)</text>
    <text x="211" y="718" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">motivo · id_usuario · fecha · datos_json</text>
    <text x="211" y="734" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">índice IX (id_taller, fecha) · eventos inmutables</text>
    <text x="211" y="756" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">cada transición de la máquina de estados</text>

    <!-- TALLER_SOLICITUDES_CAMBIO -->
    <rect x="489" y="600" width="276" height="170" rx="6" fill="#f5f5f5"/>
    <rect x="489" y="600" width="276" height="170" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="505" y="622" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono',monospace">taller_solicitudes_cambio</text>
    <text x="505" y="638" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">PK id_solicitud</text>
    <text x="505" y="654" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">FK id_taller · N</text>
    <text x="505" y="670" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">estado · CHECK Pendiente|Aprobada|Rechazada|Cancelada</text>
    <text x="505" y="686" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">datos_json · diff antes/después + motivos + actores</text>
    <text x="505" y="702" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">auditoría estándar (fechas + usuarios)</text>
    <text x="505" y="718" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">índices IX (id_taller) · IX (estado)</text>
    <text x="505" y="734" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">resuelve el CEM desde la Matriz General</text>
    <text x="505" y="756" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">DTO del taller expone solicitudCambioPendiente (join)</text>

    <!-- Nota: ajustes post-cierre (polimórfico) -->
    <rect x="40" y="820" width="880" height="120" rx="6" fill="#f5f5f5"/>
    <rect x="40" y="820" width="880" height="120" rx="6" fill="rgba(45,49,66,.02)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="48" y="828" width="120" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,.4)" stroke-width="0.8"/>
    <text x="108" y="837" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">ADR-00010 / ADR-00011</text>
    <text x="56" y="860" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono',monospace">ajustes_post_cierre</text>
    <text x="240" y="860" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">bitácora polimórfica: entidad_tipo (RUTA_VISITA | RUTA_VERSION | TALLER) + id_entidad · sin FK física</text>
    <text x="56" y="880" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">accion · CHECK (MOVER_VISITA · EDITAR_HORAS · ALTA_VISITA · BAJA_VISITA · EDITAR_TALLER · CANCELAR_VERSION)</text>
    <text x="56" y="896" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">valores_antes / valores_despues (JSON) · motivo · id_usuario · fecha_ajuste · índice IX (entidad_tipo, id_entidad)</text>
    <text x="56" y="920" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">rutas_visitas: id_seleccion_hospital NULL + es_extraordinaria + índice único filtrado UX_rutas_visitas_hospital (visita extraordinaria)</text>
    <text x="56" y="934" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">taller_aprobaciones ELIMINADA (0023): la bitácora del motor cubre las firmas (Elaboró/Revisó/Autorizó)</text>

    <!-- Leyenda -->
    <line x1="40" y1="966" x2="920" y2="966" stroke="rgba(45,49,66,.10)" stroke-width="0.8"/>
    <text x="40" y="982" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEYENDA</text>
    <rect x="124" y="974" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="156" y="986" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">tabla con FK física al taller</text>
    <rect x="332" y="974" width="24" height="16" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="364" y="986" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">tabla con firma digital (accent)</text>
    <path d="M 556 990 L 578 990 M 572 984 L 578 990 L 572 996" fill="none" stroke="#4f5d75" stroke-width="1"/>
    <text x="588" y="986" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">1 → N (uno a muchos) · 1:1 material</text>
    <line x1="740" y1="982" x2="780" y2="982" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="788" y="986" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">nota / sin FK</text>
  </svg>

  <p class="colophon">lefarma.docs/educacion-medica · diagramas/000008_er_imparticion.html · 2026-10-10</p>
</div>
