<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impartición de Talleres — Flujo digital (ADR-00008)</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75;
    --color-soft:#7a8399; --color-accent:#eb6c36;
    --font-sans:'Geist',sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--font-sans);background:var(--color-paper);color:var(--color-ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem;}
  .wrap{max-width:960px;width:100%;}
  .eyebrow{font-family:var(--font-mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--color-muted);margin-bottom:.5rem;}
  h1{font-family:var(--font-serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:.25rem;}
  .sub{font-family:var(--font-mono);font-size:.72rem;color:var(--color-soft);margin-bottom:1.5rem;}
  svg{display:block;width:100%;height:auto;}
  .colophon{margin-top:1.25rem;padding-top:.75rem;border-top:1px solid rgba(45,49,66,.12);font-family:var(--font-mono);font-size:.68rem;color:var(--color-soft);letter-spacing:.04em;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Educación Médica · ADR-00008 · TO-BE</p>
  <h1>Impartición de talleres — flujo digital</h1>
  <p class="sub">Cierre de matriz → Programado automático → material → EnCurso → asistencias/evidencias → Realizado</p>

  <svg viewBox="0 0 960 1120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flujo digital de la impartición del taller con historial de estados y cancelación">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <!-- Conectores verticales del flujo principal (antes que las cajas) -->
    <line x1="480" y1="224" x2="480" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="428" x2="480" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="632" x2="480" y2="676" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <line x1="480" y1="836" x2="480" y2="880" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Cancelado: ramas desde Programado y EnCurso (accent, dashed, codos r=8) -->
    <path d="M 652 330 L 792 330 Q 800 330 800 338 L 800 906 Q 800 914 792 914 L 660 914"
          fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arrow-accent)"/>
    <path d="M 652 534 L 812 534 Q 820 534 820 542 L 820 902"
          fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="6,4"/>
    <line x1="820" y1="902" x2="820" y2="914" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="6,4"/>

    <!-- Solicitud de cambio: nota lateral izquierda -> Matriz General -->
    <path d="M 296 862 L 150 862 Q 142 862 142 854 L 142 200 Q 142 192 150 192 L 296 192"
          fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <!-- Labels de flechas (mask + gap 6-10px) -->
    <rect x="488" y="235" width="132" height="12" rx="2" fill="#f5f5f5"/>
    <text x="492" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">AUTOMÁTICO · DC CERRAR</text>
    <rect x="488" y="439" width="152" height="12" rx="2" fill="#f5f5f5"/>
    <text x="492" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">FIRMA EV · MATERIAL CONFIRMADO</text>
    <rect x="488" y="643" width="132" height="12" rx="2" fill="#f5f5f5"/>
    <text x="492" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">EV/EP · SUGERIDO EL DÍA</text>
    <rect x="488" y="847" width="152" height="12" rx="2" fill="#f5f5f5"/>
    <text x="492" y="856" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">≥1 EVIDENCIA + ≥1 ASISTENCIA</text>
    <rect x="674" y="520" width="96" height="12" rx="2" fill="#f5f5f5"/>
    <text x="678" y="529" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace">MOTIVO OBLIG.</text>
    <rect x="156" y="520" width="120" height="12" rx="2" fill="#f5f5f5"/>
    <text x="160" y="529" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">CANDADO PUESTO</text>

    <!-- 1. Cierre de matriz -->
    <rect x="320" y="44" width="320" height="180" rx="6" fill="#f5f5f5"/>
    <rect x="320" y="44" width="320" height="180" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="328" y="52" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.4)" stroke-width="0.8"/>
    <text x="342" y="61" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">1</text>
    <text x="480" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Cierre de la Matriz (DC)</text>
    <text x="336" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">acción CERRAR del Director Corporativo</text>
    <text x="336" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">todos los talleres → Programado (auto)</text>
    <text x="336" y="128" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">historial origen Automático</text>
    <text x="336" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">sin paso manual del AEM</text>
    <text x="336" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">Autorizado queda solo si se revierte el disparador</text>

    <!-- 2. Material -->
    <rect x="320" y="268" width="320" height="160" rx="6" fill="#f5f5f5"/>
    <rect x="320" y="268" width="320" height="160" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <rect x="328" y="276" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,.55)" stroke-width="0.8"/>
    <text x="342" y="285" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">2</text>
    <text x="480" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Material del taller (FOR-007)</text>
    <text x="336" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">AEM registra el paquete (1:1 por taller)</text>
    <text x="336" y="336" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">checklist: lista · flayers · cómputo · proyector · dulces · modelo</text>
    <text x="336" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">EV confirma recepción con firma digital (fecha + usuario)</text>
    <text x="336" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">el papel firmado se sube además como evidencia</text>
    <text x="336" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">regla 7 días (foránea): aviso, no candado</text>

    <!-- 3. EnCurso -->
    <rect x="320" y="472" width="320" height="160" rx="6" fill="#f5f5f5"/>
    <rect x="320" y="472" width="320" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="328" y="480" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.4)" stroke-width="0.8"/>
    <text x="342" y="489" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">3</text>
    <text x="480" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">En curso · día del taller</text>
    <text x="336" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">EV/EP marca el inicio cuando puede</text>
    <text x="336" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">sin candado de horario; el sistema sugiere el día</text>
    <text x="336" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">transiciones válidas solo: Realizado o Cancelado</text>
    <text x="336" y="572" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">los modales de impartición habilitan captura</text>

    <!-- 4. Asistencias + evidencias -->
    <rect x="320" y="676" width="320" height="160" rx="6" fill="#f5f5f5"/>
    <rect x="320" y="676" width="320" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="328" y="684" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.4)" stroke-width="0.8"/>
    <text x="342" y="693" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">4</text>
    <text x="480" y="708" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Asistencias (FOR-008) + evidencias</text>
    <text x="336" y="728" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">lista llenada a mano → transcripción al sistema</text>
<text x="336" y="744" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">hasta 20 asistentes · transcripción</text>
<text x="336" y="760" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">hoja firmada (foto/escaneo) → evidencia</text>
    <text x="336" y="776" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">fotos/video/documentos solo con el taller En curso</text>
    <text x="336" y="792" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">imprimibles FOR-007/008 pre-llenados</text>

    <!-- 5. Realizado -->
    <rect x="320" y="880" width="320" height="160" rx="6" fill="#f5f5f5"/>
    <rect x="320" y="880" width="320" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="328" y="888" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.4)" stroke-width="0.8"/>
    <text x="342" y="897" fill="#2d3142" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">5</text>
    <text x="480" y="912" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Realizado · cierre</text>
    <text x="336" y="932" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">exige ≥1 evidencia y ≥1 asistencia (servicio)</text>
    <text x="336" y="948" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">escribe fecha_realizado</text>
    <text x="336" y="964" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">alimenta cobertura_taller del ranking</text>
    <text x="336" y="980" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">sin transiciones posteriores</text>

    <!-- Cancelado -->
    <rect x="660" y="880" width="268" height="160" rx="6" fill="#f5f5f5"/>
    <rect x="660" y="880" width="268" height="160" rx="6" fill="rgba(235,108,54,.06)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="668" y="888" width="56" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,.55)" stroke-width="0.8"/>
    <text x="696" y="897" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">RAMAL</text>
    <text x="794" y="912" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Cancelado</text>
    <text x="676" y="932" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">GV / AEM / CEM</text>
    <text x="676" y="948" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">motivo obligatorio</text>
    <text x="676" y="964" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">desde Programado o En curso</text>
    <text x="676" y="980" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">borrar taller: solo con Matriz en Creada</text>

    <!-- Historial (nota) -->
    <rect x="660" y="44" width="268" height="180" rx="6" fill="#f5f5f5"/>
    <rect x="660" y="44" width="268" height="180" rx="6" fill="rgba(45,49,66,.02)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="668" y="52" width="88" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,.4)" stroke-width="0.8"/>
    <text x="712" y="61" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">HISTORIAL</text>
    <text x="676" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">taller_estados_historial</text>
    <text x="676" y="104" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">cada transición: estado anterior → nuevo</text>
    <text x="676" y="120" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">origen Automático (cierre) / Manual</text>
    <text x="676" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">motivo · usuario · fecha</text>
    <text x="676" y="152" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">eventos inmutables (consulta por taller)</text>

    <!-- Solicitud de cambio (nota) -->
    <rect x="32" y="676" width="264" height="364" rx="6" fill="#f5f5f5"/>
    <rect x="32" y="676" width="264" height="364" rx="6" fill="rgba(45,49,66,.02)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
    <rect x="40" y="684" width="72" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,.4)" stroke-width="0.8"/>
    <text x="76" y="693" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">ADR-00010</text>
    <text x="48" y="716" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif">Solicitud de cambio</text>
    <text x="48" y="736" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">el equipo no edita con el candado puesto</text>
    <text x="48" y="752" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">envía solicitud (diff + motivo en JSON)</text>
    <text x="48" y="768" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">taller_solicitudes_cambio → Pendiente</text>
    <text x="48" y="784" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">notificación in-app + correo al CEM</text>
    <text x="48" y="812" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif">Resolución (CEM, Matriz General)</text>
    <text x="48" y="832" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">pendientes arriba con icono</text>
    <text x="48" y="848" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">aprobar → misma lógica del ajuste + auditoría</text>
    <text x="48" y="864" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">rechazar → solo motivo</text>
    <text x="48" y="880" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">aviso al solicitante (in-app + correo)</text>
    <text x="48" y="908" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif">Ajuste directo del CEM (vía rápida)</text>
    <text x="48" y="928" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">permiso exclusivo + motivo + límite 45 días</text>
    <text x="48" y="944" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">fecha/hora/lugar/participantes (Programado)</text>
    <text x="48" y="960" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">mover fecha → mueve la visita de la ruta</text>
    <text x="48" y="988" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif">Auditoría</text>
    <text x="48" y="1008" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">ajustes_post_cierre: antes/después + motivo</text>
    <text x="48" y="1024" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace">visible en "Ajustes" por taller/versión</text>

    <!-- Leyenda -->
    <line x1="32" y1="1064" x2="928" y2="1064" stroke="rgba(45,49,66,.10)" stroke-width="0.8"/>
    <text x="32" y="1080" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEYENDA</text>
    <rect x="116" y="1072" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="148" y="1084" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">estado del taller</text>
    <rect x="276" y="1072" width="24" height="16" rx="4" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
    <text x="308" y="1084" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">firma / cancelación (accent)</text>
    <line x1="472" y1="1080" x2="512" y2="1080" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="520" y="1084" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">transición del taller</text>
    <line x1="672" y1="1080" x2="712" y2="1080" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#arrow-accent)"/>
    <text x="720" y="1084" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">cancelación con motivo</text>
    <line x1="116" y1="1104" x2="156" y2="1104" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="164" y="1108" fill="#4f5d75" font-size="8" font-family="'Geist',sans-serif">nota / fuera del flujo principal</text>
  </svg>

  <p class="colophon">lefarma.docs/educacion-medica · diagramas/000008_flujo_imparticion.html · 2026-10-10</p>
</div>
</body>
