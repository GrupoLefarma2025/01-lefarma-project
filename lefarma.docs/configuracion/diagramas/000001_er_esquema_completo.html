  .row-name { font: 400 11px var(--mono); fill: var(--ink); }

  .badge-pk rect { fill: var(--accent); }
  .badge-pk text { fill: #ffffff; }
  .badge-fk rect { fill: rgba(45,49,66,.12); }
  .badge-fk text { fill: var(--ink); }
  .badge-other rect { fill: rgba(45,49,66,.055); }
  .badge-other text { fill: var(--muted); }

  .conn { fill: none; stroke: var(--muted); stroke-width: 1.2; }
  .conn-label { font: 400 9px var(--mono); fill: var(--muted); }
  .card-num { font: 400 9px var(--mono); fill: var(--soft); }
  .caption { font: 400 9.5px var(--mono); fill: var(--soft); }

  .panel-title { font: 600 10px var(--mono); letter-spacing: .14em; fill: var(--muted); }
  .panel-sep { stroke: rgba(45,49,66,.10); stroke-width: 1; }
  .panel-line { font: 400 9.5px var(--mono); fill: var(--ink); }
  .panel-sub { font: 600 9px var(--mono); letter-spacing: .12em; fill: var(--accent); }

  <g class="notes"><rect class="card" x="48" y="730" width="640" height="400" rx="8"/><text class="panel-title" x="68" y="758">REGLAS DEL ESQUEMA</text><line class="panel-sep" x1="68" y1="770" x2="668" y2="770"/><text class="panel-line" x="68" y="792">PK_variables · PK_variables_bitacora · PK_integraciones (clustered)</text><text class="panel-line" x="68" y="809">UQ_variables_clave · UQ_variables_bitacora_id_operacion</text><text class="panel-line" x="68" y="826">UQ_integraciones_prefijo_llave · UQ_integraciones_hash_llave</text><text class="panel-line" x="68" y="843">FK_variables_bitacora_variable → config.variables (id_variable)</text><text class="panel-line" x="68" y="860">FK_variables_bitacora_origen → config.variables_bitacora (id_bitacora)</text><text class="panel-line" x="68" y="877">CK_variables_tipo_dato: 12 tipos (string … json)</text><text class="panel-line" x="68" y="894">CK_variables_valor_json · CK_variables_esquema_json: ISJSON = 1</text><text class="panel-line" x="68" y="911">CK_variables_destino: al menos un destino = 1</text><text class="panel-line" x="68" y="928">CK_variables_bitacora_accion: crear · actualizar · desactivar · reactivar · restaurar</text><text class="panel-line" x="68" y="945">IX_variables_bitacora_id_variable (id_variable, id_bitacora DESC)</text><text class="panel-line" x="68" y="962">IX_variables_bitacora_fecha_creacion (fecha_creacion)</text><text class="panel-line" x="68" y="979">Append-only: sin UPDATE/DELETE; sin triggers; solo escribe la API.</text><text class="panel-line" x="68" y="996">id_bitacora = revisión global · id_operacion = idempotencia</text><text class="panel-sub" x="68" y="1013">FLUJO DE ESCRITURA (API, una transacción)</text><text class="panel-line" x="68" y="1030">1. Valida tipo, JSON, destinos y versión leída.</text><text class="panel-line" x="68" y="1047">2. UPDATE variables: valor, flags, version = version + 1.</text><text class="panel-line" x="68" y="1064">3. INSERT bitácora con id_operacion único (idempotencia).</text><text class="panel-line" x="68" y="1081">4. COMMIT → evento SSE; polling 10 min reconcilia.</text></g>
